<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JWWリーダー</title>
  <meta name="description" content="JWW(Jw_cad)図面をブラウザで開いて閲覧する。図面は端末の外に送信されません。">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b63ce">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <label class="btn primary" for="file">開く</label>
    <input id="file" type="file" accept=".jww,.jwc,application/octet-stream" hidden>
    <span id="name" class="name">図面が開かれていません</span>
    <button id="od-btn" class="btn" type="button">OneDrive</button>
    <button id="fit" class="btn" type="button" disabled>全体</button>
    <button id="layers-btn" class="btn" type="button" disabled>レイヤ</button>
    <button id="theme" class="btn" type="button" aria-label="背景色を切り替え">白/黒</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="図面表示"></canvas>
    <div id="empty" class="empty">
      <p>JWWファイルをここにドラッグするか、<br>左上の「開く」から選んでください。</p>
      <p class="note">図面はこの端末の中だけで処理され、外部には送信されません。</p>
    </div>
    <div id="busy" class="busy" hidden>読み込み中…</div>
  </main>

  <nav id="tools" class="tools" aria-label="測定・注釈" hidden>
    <div class="tool-row" role="group" aria-label="ツール">
      <button class="tool" type="button" data-tool="move" aria-pressed="true">移動</button>
      <button class="tool" type="button" data-tool="obj" aria-pressed="false">図形</button>
      <button class="tool" type="button" data-tool="select" aria-pressed="false">注釈選択</button>
      <button class="tool" type="button" data-tool="dim" aria-pressed="false">寸法</button>
      <button class="tool" type="button" data-tool="area" aria-pressed="false">面積</button>
      <button class="tool" type="button" data-tool="route" aria-pressed="false">ルート</button>
      <button class="tool" type="button" data-tool="pen" aria-pressed="false">赤ペン</button>
      <button class="tool" type="button" data-tool="text" aria-pressed="false">コメント</button>
      <button class="tool" type="button" data-tool="erase" aria-pressed="false">消す</button>
    </div>
    <div class="tool-row sub">
      <label class="scale">縮尺 1/<input id="scale" type="number" inputmode="numeric" min="1" step="1" value="100" aria-label="縮尺の分母"></label>
      <span id="tool-hint" class="hint"></span>
      <button id="t-add" class="btn small" type="button" aria-pressed="false" hidden>追加選択</button>
      <button id="t-rl" class="btn small" type="button" hidden>↺90°</button>
      <button id="t-rr" class="btn small" type="button" hidden>↻90°</button>
      <button id="t-big" class="btn small" type="button" hidden>×1.25</button>
      <button id="t-small" class="btn small" type="button" hidden>×0.8</button>
      <button id="t-copy" class="btn small" type="button" hidden>複製</button>
      <button id="t-edit" class="btn small" type="button" hidden>文字</button>
      <button id="t-del" class="btn small" type="button" hidden>削除</button>
      <button id="t-done" class="btn small" type="button" hidden>完了</button>
      <button id="t-cancel" class="btn small" type="button" hidden>取消</button>
      <button id="t-undo" class="btn small" type="button">戻す</button>
      <button id="t-export" class="btn small" type="button">書出</button>
    </div>
  </nav>

  <div id="update" class="update" role="status" hidden>
    <span>新しい版があります。</span>
    <button id="update-btn" class="btn small" type="button">更新する</button>
  </div>

  <footer id="status" class="status" role="status"></footer>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <strong>レイヤ</strong>
      <button id="all-on" class="btn small" type="button">すべて表示</button>
      <button id="all-off" class="btn small" type="button">すべて非表示</button>
      <button id="panel-close" class="btn small" type="button" aria-label="閉じる">×</button>
    </div>
    <input id="layer-search" class="search" type="search" placeholder="グループ名・レイヤ名で絞り込み" autocomplete="off">
    <label class="opt"><input id="show-empty" type="checkbox"> 図形のないレイヤも表示</label>
    <ul id="layer-list" class="layer-list"></ul>
  </aside>

  <dialog id="od" class="od">
    <div class="od-head">
      <strong data-od-title>OneDrive</strong>
      <button class="btn small" type="button" data-od-close aria-label="閉じる">×</button>
    </div>
    <div class="od-body" data-od-body></div>
  </dialog>

  <dialog id="txt" class="od">
    <form method="dialog" class="od-body">
      <strong>コメント</strong>
      <textarea id="txt-input" class="search" rows="3" maxlength="200" placeholder="例: ここにバルブ追加" style="padding:8px 12px"></textarea>
      <div class="row">
        <button class="btn" value="cancel" formnovalidate>やめる</button>
        <button class="btn primary" value="ok">入れる</button>
      </div>
    </form>
  </dialog>

  <dialog id="ex" class="od">
    <div class="od-head">
      <strong>書き出し・注釈の管理</strong>
      <button class="btn small" type="button" data-ex-close aria-label="閉じる">×</button>
    </div>
    <div class="od-body">
      <p class="note">図面と注釈を、用紙の大きさのPDFにします(画像形式のPDF)。原本のJWWは変更されません。</p>
      <button id="ex-pdf" class="btn primary" type="button">PDFにする(標準)</button>
      <button id="ex-pdf-hi" class="btn" type="button">PDFにする(高画質・大きい)</button>
      <label class="opt"><input id="ex-overlay" type="checkbox" checked> 注釈を入れる</label>
      <hr>
      <p class="note">注釈だけを、ファイル(JSON)として保存・読み込みできます。端末にも自動で保存されます。</p>
      <button id="ex-json" class="btn" type="button">注釈をファイルに保存</button>
      <label class="btn" for="ex-json-file">注釈ファイルを読み込む</label>
      <input id="ex-json-file" type="file" accept=".json,application/json" hidden>
      <button id="ex-clear" class="btn" type="button">注釈をすべて消す</button>
      <button id="ex-reset-edits" class="btn" type="button">図形の編集をすべて元に戻す</button>
      <p id="ex-msg" class="note" role="status"></p>
    </div>
  </dialog>

  <script src="vendor/msal-browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
