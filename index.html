<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JWWリーダー</title>
  <meta name="description" content="JWW(Jw_cad)図面をブラウザで開いて閲覧する。図面は端末の外に送信されません。">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b63ce">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <label class="btn primary" for="file">開く</label>
    <input id="file" type="file" hidden>
    <span id="name" class="name">図面が開かれていません</span>
    <button id="fit" class="btn" type="button" disabled>全体</button>
    <button id="layers-btn" class="btn" type="button" disabled>レイヤ</button>
    <button id="theme" class="btn" type="button" aria-label="背景色を切り替え">白/黒</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="図面表示"></canvas>
    <div id="empty" class="empty">
      <p>JWWファイルをここにドラッグするか、<br>左上の「開く」から選んでください。</p>
      <p class="note">図面はこの端末の中だけで処理され、外部には送信されません。</p>
    </div>
    <div id="busy" class="busy" hidden>読み込み中…</div>
  </main>

  <footer id="status" class="status" role="status"></footer>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <strong>レイヤ</strong>
      <button id="all-on" class="btn small" type="button">すべて表示</button>
      <button id="all-off" class="btn small" type="button">すべて非表示</button>
      <button id="panel-close" class="btn small" type="button" aria-label="閉じる">×</button>
    </div>
    <input id="layer-search" class="search" type="search" placeholder="レイヤ名で絞り込み" autocomplete="off">
    <ul id="layer-list" class="layer-list"></ul>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
